<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>给亲爱的老妈｜母亲节快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff7f2;
            font-family: 'Georgia', 'Times New Roman', '宋体', 'Segoe UI', 'Roboto', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 56px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.02);
            padding: 40px 32px 50px;
            text-align: center;
            transition: all 0.2s ease;
            border: 1px solid #ffe3d6;
        }

        .flower-icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: gentleFloat 3s ease-in-out infinite;
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        .greeting {
            font-size: 2.6rem;
            color: #b45a40;
            letter-spacing: 2px;
            font-weight: normal;
            margin-bottom: 20px;
            font-family: 'Georgia', cursive;
        }

        .greeting small {
            font-size: 1rem;
            display: block;
            color: #cc8062;
            margin-top: 10px;
            font-style: italic;
            font-weight: normal;
        }

        .poem {
            background: #fefaf7;
            border-radius: 48px;
            padding: 32px 28px;
            margin: 28px 0;
            text-align: left;
            box-shadow: inset 0 0 0 1px #fff4ed, 0 12px 22px rgba(110, 55, 35, 0.04);
        }

        .poem p {
            font-size: 1.2rem;
            line-height: 1.85;
            margin-bottom: 24px;
            color: #3e2c25;
            font-weight: 440;
            border-left: 4px solid #f2bc9a;
            padding-left: 20px;
        }

        .special-line {
            font-size: 1.2rem;
            font-weight: 520;
            color: #b45a40;
            background: #fff0e6;
            border-radius: 40px;
            padding: 14px 18px;
            margin-top: 16px;
            text-align: center;
            border-left: none;
            letter-spacing: 1px;
        }

        .blessing {
            margin: 30px 0 20px;
            font-size: 2rem;
            font-weight: bold;
            color: #c47252;
            line-height: 1.3;
            letter-spacing: 2px;
        }

        .blessing span {
            display: inline-block;
            background: #fef0e8;
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 1.45rem;
            font-weight: 500;
        }

        .happy-mom-day {
            font-size: 1.9rem;
            margin-top: 20px;
            color: #d38462;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .footer-sign {
            margin-top: 34px;
            font-size: 1rem;
            color: #a0725c;
            border-top: 1px dashed #f0cebc;
            padding-top: 22px;
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        @media (max-width: 550px) {
            .card {
                padding: 28px 20px 38px;
            }
            .greeting {
                font-size: 2rem;
            }
            .poem p {
                font-size: 1rem;
                padding-left: 14px;
                margin-bottom: 20px;
            }
            .blessing span {
                font-size: 1.1rem;
                padding: 5px 18px;
            }
            .happy-mom-day {
                font-size: 1.5rem;
            }
            .flower-icon {
                font-size: 52px;
            }
            .special-line {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="flower-icon">🌷🌸🌷</div>

        <div class="greeting">
            亲爱的老妈
            <small>你先是你自己，然后才是我的妈妈</small>
        </div>

        <div class="poem">
            <p>🌿 我用一辈子和你说再见，<br>你却用一生祈祷我平安。</p>
            <p>🌌 宇宙洪荒，生命浩瀚，<br>但只有你和我，共享过心跳。</p>
            <p>🌲 你是坚韧的大树，也是温柔的阳光；<br>人生路上，人来人往，唯有母爱始终如一。</p>
            <div class="special-line">
                ❤️ 谢谢您，选择成为我的妈妈 ❤️
            </div>
        </div>

        <div class="blessing">
            <span>🌟 祝妈妈万事顺遂，福如安康 🌟</span>
        </div>

        <div class="happy-mom-day">
            💐 母亲节快乐 💐
        </div>

        <div class="footer-sign">
            <span>🏡 永远爱您的孩子</span>
            <span>📆 每一天都是母亲节</span>
        </div>
    </div>
</body>
</html>
